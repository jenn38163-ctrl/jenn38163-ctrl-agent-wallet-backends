# Local development only. Do not use these services or credentials as a production deployment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: registry
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  wallet-db:
    image: postgres:17
    environment:
      POSTGRES_USER: agent_wallet
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:?Set WALLET_DB_PASSWORD in .env}
      POSTGRES_DB: agent_wallet
    ports: ["127.0.0.1:5433:5432"]
    volumes: [walletdata:/var/lib/postgresql/data]
volumes:
  pgdata: {}
  walletdata: {}
